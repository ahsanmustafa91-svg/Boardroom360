services:
  - type: web
    name: boardroom360
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boardroom360-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: boardroom360-db
    plan: free
    region: singapore
